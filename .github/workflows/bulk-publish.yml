name: Publish 1,460 article pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bulk-publish.yml'
      - 'scripts/generate_articles.py'
      - 'data/article-generation-map.json'
      - 'scripts/bulk-publish-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate article pages and sitemap
        run: python scripts/generate_articles.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Publish 1,460 additional article pages"
            git push
          fi
